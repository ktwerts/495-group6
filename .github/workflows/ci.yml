name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run on the same branch when a newer commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install "ruff>=0.6"
      - name: Lint
        run: ruff check . --output-format=github
      - name: Formatting (run `ruff format .` locally to fix)
        run: ruff format --check .

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install "bandit[toml]>=1.7" "pip-audit>=2.7"
      - name: Static security analysis
        run: bandit -c pyproject.toml -r app -ll
      - name: Known-vulnerable dependency check
        run: pip-audit -r requirements.txt

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: >
          pytest --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80 --junitxml=test-results.xml --durations=5
      - name: Publish summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          print(f"### Python ${{ matrix.python-version }}")
          if os.path.exists("test-results.xml"):
              s = ET.parse("test-results.xml").getroot()
              s = s if s.tag == "testsuite" else s.find("testsuite")
              print(f"- Tests: {s.get('tests')}  Failures: {s.get('failures')}  "
                    f"Errors: {s.get('errors')}  Skipped: {s.get('skipped')}")
          if os.path.exists("coverage.xml"):
              rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
              print(f"- Line coverage: {rate:.1f}%")
          EOF
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore

  build:
    name: Build check (app boots + seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements.txt
      - name: Seed database and smoke-test key endpoints
        env:
          SHIFTWISE_ENV: testing
          SHIFTWISE_ADMIN_PASSWORD: ci-only-password
        run: |
          flask --app run seed
          python - <<'EOF'
          from run import app
          c = app.test_client()
          assert c.get("/health").status_code == 200
          r = c.post("/api/auth/login", json={"username": "manager", "password": "ci-only-password"})
          assert r.status_code == 200, r.get_json()
          for page in ("/", "/employees", "/schedule", "/forecast"):
              assert c.get(page).status_code == 200, page
          r = c.post("/api/forecast/train")
          assert r.status_code == 200, r.get_json()
          assert r.get_json()["method"] == "random_forest", r.get_json()
          forecast = c.get("/api/forecast").get_json()
          assert len(forecast["days"]) == 7, forecast
          assert all(d["predicted_staff_needed"] >= 1 for d in forecast["days"]), forecast
          # TODO(team): as features land, assert key API responses here too
          # (e.g. /api/employees returns the seeded employees).
          print("Smoke test OK")
          EOF
