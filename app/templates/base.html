<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShiftWise AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">ShiftWise AI</a>
    <nav>
      {% if g.user and g.user['role'] == 'manager' %}
        <a href="{{ url_for('employees.employees_page') }}">Employees</a>
        <a href="{{ url_for('scheduling.schedule_page') }}">Schedule</a>
        <a href="{{ url_for('forecasting.forecast_page') }}">Forecast</a>
      {% endif %}
      {% if g.user %}
        <span class="muted">{{ g.user['username'] }}</span>
        <button id="logout-btn" class="link-btn">Log out</button>
      {% else %}
        <a href="{{ url_for('auth.login_page') }}">Log in</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    <div id="flash" class="flash" hidden></div>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
